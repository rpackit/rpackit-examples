name: hello-shiny Windows release

on:
  push:
    tags:
      - "hello-shiny-v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hello-shiny-windows-${{ github.ref }}
  cancel-in-progress: false

env:
  RPACKIT_SOURCE_SHA: "55ff5ad55337aef9171a9a473f39c0eacc01aa26"
  RPACKIT_RUNTIME_VERSION: "4.6.1"

jobs:
  build-install-release:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out pinned rpackit source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: rpackit/rpackit
          ref: ${{ env.RPACKIT_SOURCE_SHA }}

      - name: Check out this examples revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: gate-inputs/examples
          ref: ${{ github.sha }}

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1

      - name: Configure runner-scoped storage
        shell: powershell
        run: |
          $root = Join-Path $env:RUNNER_TEMP (
            "rpackit-hello-release-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          )
          @(
            "RPACKIT_RELEASE_ROOT=$root",
            "RPACKIT_BUNDLE=$(Join-Path $root 'bundle')",
            "RPACKIT_PROJECT=$(Join-Path $root 'project')",
            "RPACKIT_RUNTIME_CACHE=$(Join-Path $root 'runtime-cache')",
            "RPACKIT_INSTALL_DIR=$(Join-Path $root 'installed')",
            "RPACKIT_EVIDENCE=$(Join-Path $root 'installed-evidence.json')",
            "RPACKIT_RELEASE_DIR=$(Join-Path $root 'release')",
            "CARGO_TARGET_DIR=$(Join-Path $root 'cargo-target')"
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install pinned rpackit source
        shell: powershell
        run: |
          R.exe CMD INSTALL .
          if ($LASTEXITCODE -ne 0) {
            throw "Pinned rpackit source installation failed."
          }

      - name: Generate hello-shiny native project
        shell: Rscript {0}
        run: |
          bundle <- rpackit::prepare_desktop(
            "gate-inputs/examples/hello-shiny",
            output_dir = Sys.getenv("RPACKIT_BUNDLE"),
            r_version = Sys.getenv("RPACKIT_RUNTIME_VERSION"),
            cache_dir = Sys.getenv("RPACKIT_RUNTIME_CACHE"),
            verify_runtime = TRUE,
            quiet = TRUE
          )
          project <- rpackit::generate_tauri_app(
            bundle$path,
            output_dir = Sys.getenv("RPACKIT_PROJECT"),
            product_name = "rpackit Hello Shiny",
            identifier = "dev.rpackit.generated-hello-shiny",
            version = "0.1.0",
            verify_runtime = TRUE,
            quiet = TRUE
          )
          stopifnot(
            isTRUE(project$validation$valid),
            identical(project$validation$template_version, "1.1.0")
          )

      - name: Build current-user NSIS installer
        shell: powershell
        run: |
          cargo install tauri-cli --version 2.11.4 --locked
          Set-Location (Join-Path $env:RPACKIT_PROJECT "src-tauri")
          cargo tauri build
          if ($LASTEXITCODE -ne 0) {
            throw "Tauri installer build failed."
          }

      - name: Install and run without system R on PATH
        shell: powershell
        run: |
          $nsis = Join-Path $env:CARGO_TARGET_DIR "release\bundle\nsis"
          $installers = @(Get-ChildItem -LiteralPath $nsis -File -Filter "*-setup.exe")
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS setup executable."
          }

          $install = Start-Process `
            -FilePath $installers[0].FullName `
            -ArgumentList @("/S", "/D=$env:RPACKIT_INSTALL_DIR") `
            -Wait `
            -PassThru
          if ($install.ExitCode -ne 0) {
            throw "Silent NSIS installation failed."
          }

          $application = Join-Path $env:RPACKIT_INSTALL_DIR "rpackit-windows-shell.exe"
          if (-not (Test-Path -LiteralPath $application -PathType Leaf)) {
            throw "The installed application executable is missing."
          }

          $processInfo = [System.Diagnostics.ProcessStartInfo]::new()
          $processInfo.FileName = $application
          $processInfo.UseShellExecute = $false
          $processInfo.ArgumentList.Add("--evidence")
          $processInfo.ArgumentList.Add($env:RPACKIT_EVIDENCE)
          $processInfo.ArgumentList.Add("--close-after-ready")
          $processInfo.Environment["PATH"] = (
            "$env:SystemRoot\System32;$env:SystemRoot"
          )
          foreach ($name in @($processInfo.Environment.Keys)) {
            if (
              $name -eq "R_HOME" -or
              $name -like "R_LIBS*" -or
              $name -like "RSTUDIO_*"
            ) {
              $null = $processInfo.Environment.Remove($name)
            }
          }

          $applicationProcess = [System.Diagnostics.Process]::Start($processInfo)
          if (-not $applicationProcess.WaitForExit(120000)) {
            $applicationProcess.Kill($true)
            throw "The installed application timed out."
          }
          if ($applicationProcess.ExitCode -ne 0) {
            throw "The installed application failed its native lifecycle."
          }

          $evidence = Get-Content `
            -LiteralPath $env:RPACKIT_EVIDENCE `
            -Raw | ConvertFrom-Json
          foreach ($gate in @(
            "success",
            "graceful_runtime_shutdown",
            "proxy_stopped",
            "job_empty",
            "private_session_removed",
            "session_cookie_absent",
            "browsing_data_clear_queued",
            "window_destroyed",
            "profile_removed"
          )) {
            if ($evidence.$gate -ne $true) {
              throw "Installed application gate failed: $gate."
            }
          }

          $uninstaller = Join-Path $env:RPACKIT_INSTALL_DIR "uninstall.exe"
          $uninstall = Start-Process `
            -FilePath $uninstaller `
            -ArgumentList "/S" `
            -Wait `
            -PassThru
          if ($uninstall.ExitCode -ne 0) {
            throw "Silent NSIS uninstall failed."
          }
          for ($attempt = 0; $attempt -lt 120; $attempt++) {
            if (-not (Test-Path -LiteralPath $env:RPACKIT_INSTALL_DIR)) {
              break
            }
            Start-Sleep -Milliseconds 250
          }
          if (Test-Path -LiteralPath $env:RPACKIT_INSTALL_DIR) {
            throw "The installer directory remained after uninstall."
          }

      - name: Create release evidence
        shell: powershell
        run: |
          $null = New-Item -ItemType Directory -Path $env:RPACKIT_RELEASE_DIR
          $nsis = Join-Path $env:CARGO_TARGET_DIR "release\bundle\nsis"
          $installer = Get-ChildItem `
            -LiteralPath $nsis `
            -File `
            -Filter "*-setup.exe"
          $releaseName = "rpackit-hello-shiny-0.1.0-windows-x86_64-setup.exe"
          $releaseInstaller = Join-Path $env:RPACKIT_RELEASE_DIR $releaseName
          Copy-Item -LiteralPath $installer.FullName -Destination $releaseInstaller

          $hash = (
            Get-FileHash -LiteralPath $releaseInstaller -Algorithm SHA256
          ).Hash.ToLowerInvariant()
          "$hash  $releaseName" | Set-Content `
            -LiteralPath "$releaseInstaller.sha256" `
            -Encoding ascii
          Copy-Item `
            -LiteralPath $env:RPACKIT_EVIDENCE `
            -Destination (
              Join-Path $env:RPACKIT_RELEASE_DIR "installed-evidence.json"
            )

          $metadata = Get-Content `
            -LiteralPath (
              Join-Path $env:RPACKIT_PROJECT "src-tauri\rpackit-native.json"
            ) `
            -Raw | ConvertFrom-Json
          $manifest = Get-Content `
            -LiteralPath (
              Join-Path $env:RPACKIT_PROJECT "src-tauri\resources\rpackit.json"
            ) `
            -Raw | ConvertFrom-Json
          $signature = Get-AuthenticodeSignature -LiteralPath $releaseInstaller
          $provenance = [ordered]@{
            schema_version = "1"
            application = [ordered]@{
              name = "rpackit Hello Shiny"
              version = "0.1.0"
              identifier = "dev.rpackit.generated-hello-shiny"
            }
            sources = [ordered]@{
              examples_commit = $env:GITHUB_SHA
              rpackit_commit = $env:RPACKIT_SOURCE_SHA
              template_version = $metadata.template.version
              template_sha256 = $metadata.template.integrity.sha256
            }
            runtime = [ordered]@{
              r_version = $manifest.runtime.r_version
              artifact_url = $manifest.runtime.provenance.artifact_url
              sha256 = $manifest.runtime.provenance.sha256
            }
            artifact = [ordered]@{
              name = $releaseName
              sha256 = $hash
              bytes = (Get-Item -LiteralPath $releaseInstaller).Length
              authenticode_status = $signature.Status.ToString()
            }
            acceptance = [ordered]@{
              installed = $true
              bundled_r_used_with_system_r_removed_from_path = $true
              lifecycle_evidence = "installed-evidence.json"
              uninstalled = $true
            }
          }
          $provenance | ConvertTo-Json -Depth 8 | Set-Content `
            -LiteralPath (
              Join-Path $env:RPACKIT_RELEASE_DIR "release-provenance.json"
            ) `
            -Encoding utf8

      - name: Upload verified release files
        uses: actions/upload-artifact@v7
        with:
          name: rpackit-hello-shiny-windows
          path: ${{ env.RPACKIT_RELEASE_DIR }}
          if-no-files-found: error
          retention-days: 3

      - name: Publish prerelease
        if: startsWith(github.ref, 'refs/tags/hello-shiny-v')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            Get-ChildItem -LiteralPath $env:RPACKIT_RELEASE_DIR -File |
              ForEach-Object FullName
          )
          gh release create $env:GITHUB_REF_NAME @assets `
            --prerelease `
            --verify-tag `
            --title "rpackit Hello Shiny 0.1.0" `
            --notes (
              "Stage release: unsigned Windows x86_64 NSIS installer. " +
              "The workflow built it from pinned sources, installed it, " +
              "started bundled R with system R removed from PATH, verified " +
              "native cleanup evidence, and uninstalled it."
            )

      - name: Remove runner-scoped build storage
        if: always()
        shell: powershell
        run: |
          if (-not $env:RPACKIT_RELEASE_ROOT) {
            exit 0
          }
          $runner = [System.IO.Path]::GetFullPath($env:RUNNER_TEMP)
          $root = [System.IO.Path]::GetFullPath($env:RPACKIT_RELEASE_ROOT)
          if (
            -not $root.StartsWith(
              $runner,
              [System.StringComparison]::OrdinalIgnoreCase
            ) -or
            $root -eq $runner
          ) {
            throw "Refusing to remove an unsafe runner path."
          }
          if (Test-Path -LiteralPath $root) {
            Remove-Item -LiteralPath $root -Recurse -Force
          }
